<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producción consolidada · Forestal Río Claro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PRODUCCIÓN CONSOLIDADA · Forestal Río Claro
   Lee la planilla de Google Sheets y arma la tabla dinámica
   (Área > Largo > Producto) lista para imprimir.
   ========================================================= */
:root{
  --verde:#2f6b3a;
  --verde-osc:#234f2b;
  --grafito:#2b302c;
  --gris:#6a726c;
  --linea:#d8dcd8;
  --madera:#efe5d3;
  --madera-borde:#cdb68f;
  --largo:#f5f6f3;
  --fondo:#e8ebe6;
  --panel:#ffffff;
  --texto-panel:#2b302c;
  --aviso:#a2401f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --fondo:#1c201d;
    --panel:#272c28;
    --texto-panel:#e6e9e5;
    --linea:#3b423d;
    --gris:#a3aba5;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--fondo);
  color:var(--texto-panel);
  font:15px/1.45 Lato, "Segoe UI", Arial, sans-serif;
}

/* ---------- Barra de filtros (solo pantalla) ---------- */
.barra{
  background:var(--panel);
  border-bottom:1px solid var(--linea);
  position:sticky; top:0; z-index:20;
}
.barra-in{
  max-width:1100px; margin:0 auto; padding:14px 20px;
  display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end;
}
.marca{
  font-family:Raleway, Arial, sans-serif; font-weight:800; font-size:17px;
  color:var(--verde); margin-right:auto; align-self:center; letter-spacing:.01em;
}
@media (prefers-color-scheme: dark){ .marca{color:#7fb98a} }
.campo{display:flex; flex-direction:column; gap:5px}
.campo > span{font-size:12.5px; color:var(--gris); font-weight:700}
select, button, summary{
  font:inherit; color:inherit;
}
select{
  background:var(--panel); border:1px solid var(--linea); border-radius:6px;
  padding:7px 10px; min-width:110px;
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--linea); background:transparent; border-radius:999px;
  padding:5px 12px; cursor:pointer; font-size:14px;
}
.chip[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:#fff}
.chip:focus-visible, select:focus-visible, .btn:focus-visible, summary:focus-visible{
  outline:3px solid #8cc497; outline-offset:2px;
}
.acciones{display:flex; gap:8px}
.btn{
  border:1px solid var(--verde); border-radius:6px; padding:8px 16px; cursor:pointer;
  background:transparent; color:var(--verde); font-weight:700;
}
@media (prefers-color-scheme: dark){ .btn{color:#9fd0a8; border-color:#5f9a6a} }
.btn.prim{background:var(--verde); color:#fff; border-color:var(--verde)}
.btn:disabled{opacity:.5; cursor:default}

/* Selector de máquinas */
details.maq{position:relative}
details.maq summary{
  list-style:none; cursor:pointer; border:1px solid var(--linea); border-radius:6px;
  padding:7px 30px 7px 10px; min-width:200px; position:relative; background:var(--panel);
}
details.maq summary::-webkit-details-marker{display:none}
details.maq summary::after{content:"▾"; position:absolute; right:10px; top:7px; color:var(--gris)}
.maq-panel{
  position:absolute; top:calc(100% + 6px); left:0; z-index:30;
  background:var(--panel); border:1px solid var(--linea); border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  padding:12px 14px; width:min(560px, 90vw); max-height:60vh; overflow:auto;
}
.maq-top{display:flex; gap:8px; margin-bottom:10px}
.maq-top button{font-size:13px; padding:4px 10px}
.maq-grupos{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px 18px}
.maq-grupo h4{margin:0 0 4px; font:700 13px Raleway, Arial, sans-serif; color:var(--gris)}
.maq-grupo label{display:flex; gap:7px; align-items:center; font-size:14px; padding:2px 0; cursor:pointer}

/* ---------- Hoja del reporte ---------- */
main{padding:26px 16px 60px}
.hoja{
  background:#fff; color:var(--grafito);
  width:100%; max-width:820px; margin:0 auto;
  padding:34px 40px 30px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  border-radius:2px;
}
.encabezado{
  display:flex; justify-content:space-between; align-items:flex-end; gap:20px;
  padding-bottom:12px; border-bottom:3px solid var(--verde);
}
.encabezado h1{
  margin:0; font:800 26px/1.1 Raleway, Arial, sans-serif; color:var(--verde-osc);
}
.encabezado .periodo{font:700 15px Raleway, Arial, sans-serif; color:var(--grafito); margin-top:4px}
.encabezado .empresa{font-size:12.5px; color:#6a726c; margin-top:2px}
.corte{text-align:right; font-size:12.5px; color:#6a726c}
.corte strong{display:block; font:800 20px Raleway, Arial, sans-serif; color:var(--grafito)}
.filtros-aplicados{
  display:grid; grid-template-columns:auto 1fr; gap:2px 12px;
  font-size:12.5px; color:#555c57; margin:12px 0 16px;
}
.filtros-aplicados dt{font-weight:700}
.filtros-aplicados dd{margin:0}

table.td{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums}
.td th{
  font:700 12px Raleway, Arial, sans-serif; color:#555c57; text-align:right;
  padding:6px 8px; border-bottom:1.5px solid var(--grafito);
}
.td th.izq{text-align:left}
.td td{padding:3.5px 8px; text-align:right; border-bottom:1px solid #eceeea}
.td td.izq{text-align:left}
.td td.largo{font-weight:700; width:70px}
.td col.c-largo{width:70px}
.td col.c-num{width:86px}

/* Banda de área: el elemento que da identidad al reporte */
.td tr.area td{
  background:var(--madera); border-top:2px solid var(--madera-borde); border-bottom:1px solid var(--madera-borde);
  padding:7px 8px; font-weight:700;
}
.td tr.area td.nombre{
  font:800 15px Raleway, Arial, sans-serif; color:var(--grafito); text-align:left;
}
.td tr.subtotal td{background:var(--largo); font-weight:700; color:#3e4540; border-bottom:1px solid #dfe2dd}
.td tr.subtotal td.izq{font-weight:700; color:#6a726c}
.td tfoot td{
  border-top:2px solid var(--grafito); border-bottom:none; padding:8px; font-weight:800;
  font-family:Raleway, Arial, sans-serif; font-size:14px;
}
.vacio, .estado{
  text-align:center; padding:50px 10px; color:#6a726c;
}
.estado.error{color:var(--aviso)}
.estado .det{display:block; margin-top:8px; font-size:13px; color:#6a726c}
.pie{margin-top:14px; font-size:11px; color:#8a918b; display:flex; justify-content:space-between}

.cargando{
  display:inline-block; width:18px; height:18px; border:3px solid #cfe0d2; border-top-color:var(--verde);
  border-radius:50%; animation:gira 0.8s linear infinite; vertical-align:middle; margin-right:8px;
}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .cargando{animation-duration:3s} }

@media (max-width:640px){
  .hoja{padding:20px 14px}
  .encabezado{flex-direction:column; align-items:flex-start}
  .corte{text-align:left}
  .td{font-size:12px}
  .td th, .td td{padding-left:4px; padding-right:4px}
}

/* ---------- Impresión ---------- */
@page{size:A4 portrait; margin:10mm 11mm}
@media print{
  :root{color-scheme:light}
  body{background:#fff}
  .barra, .no-print{display:none !important}
  main{padding:0}
  .hoja{box-shadow:none; max-width:none; padding:0; border-radius:0}
  .td{font-size:9.5px}
  .td th{padding:3px 6px; font-size:9.5px}
  .td td{padding:1.2px 6px}
  .td tr.area td{padding:3px 6px}
  .td tr.area td.nombre{font-size:11.5px}
  .td tfoot{display:table-row-group}
  .td tfoot td{font-size:11px; padding:5px 6px}
  .encabezado h1{font-size:19px}
  .encabezado{padding-bottom:8px}
  .filtros-aplicados{margin:8px 0 10px; font-size:10.5px}
  tbody.grupo-largo{break-inside:avoid; page-break-inside:avoid}
  tr{break-inside:avoid}
  thead{display:table-header-group}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="barra no-print">
  <div class="barra-in">
    <div class="marca">Producción consolidada</div>

    <label class="campo"><span>Año</span><select id="selAnio" disabled></select></label>
    <label class="campo"><span>Mes</span><select id="selMes" disabled></select></label>

    <div class="campo"><span>Tipo</span><div class="chips" id="chipsTipo"></div></div>
    <div class="campo"><span>Área</span><div class="chips" id="chipsArea"></div></div>
    <div class="campo" id="campoRcrd"><span>RC/RD</span><div class="chips" id="chipsRcrd"></div></div>

    <div class="campo" id="campoMaq">
      <span>Máquina</span>
      <details class="maq" id="maq">
        <summary id="maqResumen">Todas</summary>
        <div class="maq-panel">
          <div class="maq-top">
            <button type="button" class="btn" id="maqTodas">Marcar todas</button>
            <button type="button" class="btn" id="maqNinguna">Quitar todas</button>
          </div>
          <div class="maq-grupos" id="maqGrupos"></div>
        </div>
      </details>
    </div>

    <div class="acciones">
      <button type="button" class="btn" id="btnActualizar">Actualizar</button>
      <button type="button" class="btn prim" id="btnImprimir" disabled>Imprimir</button>
    </div>
  </div>
</header>

<main>
  <article class="hoja" id="hoja">
    <div class="estado"><span class="cargando"></span>Leyendo la planilla de producción…</div>
  </article>
</main>

<script>
/* =========================================================
   CONFIGURACIÓN — lo único que podrías querer editar
   ========================================================= */
const CONFIG = {
  // Planilla de Google Sheets y nombre de la pestaña donde está la producción
  sheetId: "1UnOVJ-M7IYjvxBoNFcjFSFG0jKN69ebYL2G1KwiLiAk",
  hoja: "Datos",

  // Nombres de columna que se buscan en la fila de encabezados (sin importar
  // mayúsculas, tildes ni espacios). Se usa el primero que exista.
  columnas: {
    area:     ["Área", "Area"],
    maquina:  ["Máquina", "Maquina"],
    largo:    ["Largo (m)", "Largo"],
    producto: ["Producto", "Producto 2"],
    // Cantidad Real y Volumen Real cuentan cada pieza una sola vez
    // (el ayudante va en 0, así no se duplica con el operador)
    unidades: ["Cantidad Real", "Unidades"],
    m3:       ["Volumen Real (m³)", "Volumen Real (m3)", "M3"],
    tipo:     ["Tipo"],
    rcrd:     ["RD/RC", "RC/RD"],
    anio:     ["Año", "Ano"],
    mes:      ["Mes"],
    dia:      ["Día", "Dia"],
    fecha:    ["Fecha"]
  },

  // Orden de las áreas en el reporte (las que no estén aquí van al final)
  ordenAreas: ["Morbark", "Polineras", "Cilindrado", "Postes"],

  // Nombre con que se muestra cada área
  nombresArea: { "Cilindrado Volumen": "Cilindrado" },

  // Tipo marcado al abrir la página
  tipoInicial: "Producción"
};
/* ========================================================= */

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const $ = (id) => document.getElementById(id);
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

const fmtU  = new Intl.NumberFormat("es-CL", { maximumFractionDigits: 0 });
const fmtM3 = new Intl.NumberFormat("es-CL", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtP  = new Intl.NumberFormat("es-CL", { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtL  = new Intl.NumberFormat("es-CL", { maximumFractionDigits: 2 });

const estado = {
  cols: {},          // campo -> {id, type, label}
  periodos: [],      // [{anio, mesNum, mesValor}]
  filas: [],         // filas del mes elegido
  tipos: null,       // Set o null (= todos)
  areas: null,
  rcrd: null,
  maquinas: null
};

/* ---------- Lectura de Google Sheets (consulta de visualización, sin CORS) ---------- */
let contador = 0;
function consultar(tq) {
  return new Promise((resolve, reject) => {
    const nombre = "__rc" + (++contador) + "_" + Date.now();
    const s = document.createElement("script");
    let listo = false;
    const fin = () => { listo = true; clearTimeout(t); try { delete window[nombre]; } catch (e) {} s.remove(); };
    const t = setTimeout(() => { if (!listo) { fin(); reject(new Error("TIEMPO")); } }, 45000);
    window[nombre] = (r) => {
      fin();
      if (r.status === "error") {
        reject(new Error((r.errors || []).map(e => e.detailed_message || e.message).join(" ")));
      } else resolve(r.table);
    };
    s.onerror = () => { if (!listo) { fin(); reject(new Error("ACCESO")); } };
    s.onload = () => setTimeout(() => { if (!listo) { fin(); reject(new Error("ACCESO")); } }, 200);
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?sheet=${encodeURIComponent(CONFIG.hoja)}&headers=1`
          + `&tqx=${encodeURIComponent("out:json;responseHandler:" + nombre)}`
          + `&tq=${encodeURIComponent(tq)}`;
    document.head.appendChild(s);
  });
}

function valor(celda) {
  if (!celda || celda.v === null || celda.v === undefined) return null;
  const v = celda.v;
  if (typeof v === "string") {
    const m = /^Date\((\d+),(\d+),(\d+)/.exec(v);
    if (m) return new Date(+m[1], +m[2], +m[3]);
  }
  return v;
}
function numero(v) {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return v;
  let s = String(v).replace(/\s/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function literal(col, v) {
  return col.type === "number" ? String(v) : "'" + String(v).replace(/'/g, "\\'") + "'";
}
function mesIndice(v) {
  if (typeof v === "number") return v - 1;
  const i = MESES.findIndex(m => norm(m) === norm(v));
  return i;
}

/* ---------- Carga ---------- */
async function iniciar() {
  mostrarEstado("Leyendo la planilla de producción…", true);
  try {
    const cab = await consultar("select * limit 1");
    estado.cols = {};
    const porNombre = {};
    cab.cols.forEach(c => { const k = norm(c.label); if (k && !porNombre[k]) porNombre[k] = c; });
    for (const [campo, nombres] of Object.entries(CONFIG.columnas)) {
      for (const n of nombres) { if (porNombre[norm(n)]) { estado.cols[campo] = porNombre[norm(n)]; break; } }
    }
    const C = estado.cols;
    const faltan = ["area", "largo", "producto", "unidades", "m3"].filter(k => !C[k]);
    if (!(C.anio && C.mes) && !C.fecha) faltan.push("Año y Mes (o Fecha)");
    if (faltan.length) {
      const hay = cab.cols.map(c => c.label).filter(Boolean).join(", ") || "(sin encabezados)";
      throw new Error("COLUMNAS|" + faltan.join(", ") + "|" + hay);
    }
    $("campoRcrd").style.display = C.rcrd ? "" : "none";
    $("campoMaq").style.display = C.maquina ? "" : "none";
    await cargarPeriodos();
  } catch (e) { mostrarError(e); }
}

async function cargarPeriodos() {
  const C = estado.cols;
  let tabla;
  if (C.anio && C.mes) {
    tabla = await consultar(`select ${C.anio.id}, ${C.mes.id}, count(${C.area.id}) where ${C.anio.id} is not null group by ${C.anio.id}, ${C.mes.id}`);
    estado.periodos = tabla.rows.map(r => {
      const anio = numero(valor(r.c[0])), mesValor = valor(r.c[1]);
      return { anio, mesValor, mesNum: mesIndice(mesValor) };
    }).filter(p => p.anio && p.mesNum >= 0);
  } else {
    const F = C.fecha.id;
    tabla = await consultar(`select year(${F}), month(${F}), count(${F}) where ${F} is not null group by year(${F}), month(${F})`);
    estado.periodos = tabla.rows.map(r => ({ anio: numero(valor(r.c[0])), mesNum: numero(valor(r.c[1])), mesValor: null }));
  }
  if (!estado.periodos.length) throw new Error("SINDATOS");

  const anios = [...new Set(estado.periodos.map(p => p.anio))].sort((a, b) => b - a);
  $("selAnio").innerHTML = anios.map(a => `<option value="${a}">${a}</option>`).join("");
  const ultimo = estado.periodos.reduce((m, p) => (p.anio * 12 + p.mesNum > m.anio * 12 + m.mesNum ? p : m));
  $("selAnio").value = ultimo.anio;
  llenarMeses(ultimo.mesNum);
  $("selAnio").disabled = $("selMes").disabled = false;
  await cargarMes();
}

function llenarMeses(elegido) {
  const anio = +$("selAnio").value;
  const meses = estado.periodos.filter(p => p.anio === anio).sort((a, b) => a.mesNum - b.mesNum);
  $("selMes").innerHTML = meses.map(p => `<option value="${p.mesNum}">${MESES[p.mesNum]}</option>`).join("");
  if (elegido !== undefined && meses.some(p => p.mesNum === elegido)) $("selMes").value = elegido;
  else if (meses.length) $("selMes").value = meses[meses.length - 1].mesNum;
}

async function cargarMes() {
  const C = estado.cols;
  const anio = +$("selAnio").value, mesNum = +$("selMes").value;
  const periodo = estado.periodos.find(p => p.anio === anio && p.mesNum === mesNum);
  mostrarEstado(`Leyendo ${MESES[mesNum]} ${anio}…`, true);
  $("btnImprimir").disabled = true;

  const campos = ["area", "maquina", "largo", "producto", "unidades", "m3", "tipo", "rcrd", "dia", "fecha"].filter(k => C[k]);
  const ids = [...new Set(campos.map(k => C[k].id))];
  let donde;
  if (C.anio && C.mes) donde = `${C.anio.id} = ${literal(C.anio, anio)} and ${C.mes.id} = ${literal(C.mes, periodo.mesValor)}`;
  else donde = `year(${C.fecha.id}) = ${anio} and month(${C.fecha.id}) = ${mesNum}`;

  try {
    const tabla = await consultar(`select ${ids.join(", ")} where ${donde}`);
    const pos = {}; campos.forEach(k => pos[k] = ids.indexOf(C[k].id));
    estado.filas = tabla.rows.map(r => {
      const g = (k) => (pos[k] === undefined ? null : valor(r.c[pos[k]]));
      const areaOrig = String(g("area") ?? "").trim();
      return {
        area: CONFIG.nombresArea[areaOrig] || areaOrig || "(Sin área)",
        maquina: String(g("maquina") ?? "").trim() || "(Sin máquina)",
        largo: g("largo"),
        // "4 a 5 x 6,0 - RD" y "4 a 5 x 6 - RD" son el mismo producto
        producto: String(g("producto") ?? "").trim().replace(/ x (\d+),0\b/g, " x $1") || "(Sin producto)",
        u: numero(g("unidades")),
        m3: numero(g("m3")),
        tipo: String(g("tipo") ?? "").trim() || "(Sin tipo)",
        rcrd: String(g("rcrd") ?? "").trim() || "(Sin dato)",
        dia: g("dia"),
        fecha: g("fecha") instanceof Date ? g("fecha") : null
      };
    });
    estado.anio = anio; estado.mesNum = mesNum;
    prepararFiltros();
    dibujar();
  } catch (e) { mostrarError(e); }
}

/* ---------- Filtros ---------- */
function ordenAreas(a, b) {
  const ia = CONFIG.ordenAreas.indexOf(a), ib = CONFIG.ordenAreas.indexOf(b);
  if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  return a.localeCompare(b, "es");
}
const natural = (a, b) => String(a).localeCompare(String(b), "es", { numeric: true, sensitivity: "base" });

function conservar(setPrevio, disponibles) {
  if (!setPrevio) return null;
  const s = new Set([...setPrevio].filter(x => disponibles.includes(x)));
  return s.size ? s : null;
}

function prepararFiltros() {
  const tipos = [...new Set(estado.filas.map(f => f.tipo))].sort(natural);
  if (estado.tipos === null && !estado._tipoIniciado) {
    estado._tipoIniciado = true;
    const ini = tipos.find(t => norm(t) === norm(CONFIG.tipoInicial));
    estado.tipos = ini ? new Set([ini]) : null;
  } else estado.tipos = conservar(estado.tipos, tipos);

  const areas = [...new Set(estado.filas.map(f => f.area))].sort(ordenAreas);
  estado.areas = conservar(estado.areas, areas);
  const rcrd = [...new Set(estado.filas.map(f => f.rcrd))].sort(natural);
  estado.rcrd = conservar(estado.rcrd, rcrd);
  const maqs = [...new Set(estado.filas.map(f => f.maquina))];
  estado.maquinas = conservar(estado.maquinas, maqs);

  chips("chipsTipo", tipos, "tipos");
  chips("chipsArea", areas, "areas");
  chips("chipsRcrd", rcrd, "rcrd");
  armarMaquinas();
}

function chips(idCont, valores, clave) {
  const cont = $(idCont);
  cont.innerHTML = "";
  valores.forEach(v => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = v;
    b.setAttribute("aria-pressed", String(!estado[clave] || estado[clave].has(v)));
    b.onclick = () => {
      let s = estado[clave] ? new Set(estado[clave]) : new Set(valores);
      if (s.has(v)) s.delete(v); else s.add(v);
      if (s.size === 0 || s.size === valores.length) s = null;
      estado[clave] = s;
      [...cont.children].forEach(c => c.setAttribute("aria-pressed", String(!s || s.has(c.textContent))));
      dibujar();
    };
    cont.appendChild(b);
  });
}

function armarMaquinas() {
  const grupos = new Map();
  estado.filas.forEach(f => {
    if (!grupos.has(f.area)) grupos.set(f.area, new Set());
    grupos.get(f.area).add(f.maquina);
  });
  const areas = [...grupos.keys()].sort(ordenAreas);
  $("maqGrupos").innerHTML = areas.map(a => `
    <div class="maq-grupo"><h4>${esc(a)}</h4>
      ${[...grupos.get(a)].sort(natural).map(m => `
        <label><input type="checkbox" value="${esc(m)}" ${!estado.maquinas || estado.maquinas.has(m) ? "checked" : ""}> ${esc(m)}</label>`).join("")}
    </div>`).join("");
  $("maqGrupos").querySelectorAll("input").forEach(i => i.onchange = leerMaquinas);
  resumenMaquinas();
}
function leerMaquinas() {
  const todas = [...$("maqGrupos").querySelectorAll("input")];
  const marcadas = todas.filter(i => i.checked).map(i => i.value);
  estado.maquinas = marcadas.length === todas.length ? null : new Set(marcadas);
  resumenMaquinas();
  dibujar();
}
function resumenMaquinas() {
  const total = $("maqGrupos").querySelectorAll("input").length;
  $("maqResumen").textContent = !estado.maquinas ? `Todas (${total})` : `${estado.maquinas.size} de ${total}`;
}

/* ---------- Tabla dinámica ---------- */
function claveLargo(v) {
  const n = numero(v);
  return (v !== null && v !== "" && !isNaN(n) && n !== 0) ? n : String(v ?? "(Sin largo)");
}
function textoLargo(k) { return typeof k === "number" ? fmtL.format(k) : k; }
function ordenLargo(a, b) {
  if (typeof a === "number" && typeof b === "number") return a - b;
  if (typeof a === "number") return -1;
  if (typeof b === "number") return 1;
  return natural(a, b);
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function dibujar() {
  const filas = estado.filas.filter(f =>
    (!estado.tipos || estado.tipos.has(f.tipo)) &&
    (!estado.areas || estado.areas.has(f.area)) &&
    (!estado.rcrd || estado.rcrd.has(f.rcrd)) &&
    (!estado.maquinas || estado.maquinas.has(f.maquina))
  );

  // Área > Largo > Producto
  const arbol = new Map();
  let fechaMax = null;
  filas.forEach(f => {
    if (!f.u && !f.m3) return;
    const kL = claveLargo(f.largo);
    if (!arbol.has(f.area)) arbol.set(f.area, new Map());
    const A = arbol.get(f.area);
    if (!A.has(kL)) A.set(kL, new Map());
    const L = A.get(kL);
    const p = L.get(f.producto) || { u: 0, m3: 0 };
    p.u += f.u; p.m3 += f.m3; L.set(f.producto, p);
    const fe = f.fecha || (f.dia ? new Date(estado.anio, estado.mesNum, numero(f.dia)) : null);
    if (fe && !isNaN(fe) && (!fechaMax || fe > fechaMax)) fechaMax = fe;
  });

  const lista = (set, todos) => !set ? todos : [...set].sort(natural).join(", ");
  const nMaq = $("maqGrupos").querySelectorAll("input").length;
  const corte = fechaMax ? fechaMax.toLocaleDateString("es-CL", { day: "2-digit", month: "2-digit", year: "numeric" }) : "—";

  let html = `
    <div class="encabezado">
      <div>
        <h1>Producción consolidada</h1>
        <div class="periodo">${MESES[estado.mesNum]} ${estado.anio}</div>
        <div class="empresa">Forestal Río Claro Limitada</div>
      </div>
      <div class="corte">Datos al<strong>${corte}</strong></div>
    </div>
    <dl class="filtros-aplicados">
      <dt>Tipo</dt><dd>${esc(lista(estado.tipos, "Todos"))}</dd>
      ${estado.areas ? `<dt>Área</dt><dd>${esc(lista(estado.areas))}</dd>` : ""}
      ${estado.cols.rcrd && estado.rcrd ? `<dt>RC/RD</dt><dd>${esc(lista(estado.rcrd))}</dd>` : ""}
      ${estado.cols.maquina ? `<dt>Máquinas</dt><dd>${estado.maquinas ? esc(lista(estado.maquinas)) : `Todas (${nMaq})`}</dd>` : ""}
    </dl>`;

  if (!arbol.size) {
    html += `<div class="vacio">No hay producción para los filtros elegidos. Cambia el mes o marca más opciones arriba.</div>`;
    $("hoja").innerHTML = html;
    $("btnImprimir").disabled = true;
    return;
  }

  html += `<table class="td">
    <colgroup><col class="c-largo"><col><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"></colgroup>
    <thead><tr>
      <th class="izq">Largo</th><th class="izq">Producto</th>
      <th>Unidades</th><th>% Mix</th><th>M³</th><th>% M³</th>
    </tr></thead>`;

  let totU = 0, totM = 0;
  [...arbol.keys()].sort(ordenAreas).forEach(area => {
    const A = arbol.get(area);
    let aU = 0, aM = 0;
    A.forEach(L => L.forEach(p => { aU += p.u; aM += p.m3; }));
    totU += aU; totM += aM;

    const banda = `<tr class="area"><td class="nombre" colspan="2">${esc(area)}</td>
        <td>${fmtU.format(aU)}</td><td></td><td>${fmtM3.format(aM)}</td><td></td></tr>`;

    [...A.keys()].sort(ordenLargo).forEach((kL, iL) => {
      // Cada largo va en su propio bloque para que no se corte al imprimir;
      // la banda del área viaja pegada al primer largo.
      html += `<tbody class="grupo-largo">${iL === 0 ? banda : ""}`;
      const L = A.get(kL);
      let lU = 0, lM = 0;
      L.forEach(p => { lU += p.u; lM += p.m3; });
      const prods = [...L.keys()].sort(natural);
      prods.forEach((prod, i) => {
        const p = L.get(prod);
        html += `<tr>
          <td class="izq largo">${i === 0 ? esc(textoLargo(kL)) : ""}</td>
          <td class="izq">${esc(prod)}</td>
          <td>${fmtU.format(p.u)}</td><td>${lU ? fmtP.format(p.u / lU) : "—"}</td>
          <td>${fmtM3.format(p.m3)}</td><td>${lM ? fmtP.format(p.m3 / lM) : "—"}</td>
        </tr>`;
      });
      html += `<tr class="subtotal"><td></td><td class="izq">Total ${esc(textoLargo(kL))}</td>
        <td>${fmtU.format(lU)}</td><td>${fmtP.format(1)}</td>
        <td>${fmtM3.format(lM)}</td><td>${fmtP.format(1)}</td></tr></tbody>`;
    });
  });

  html += `<tfoot><tr><td colspan="2" class="izq">Total general</td>
    <td>${fmtU.format(totU)}</td><td></td><td>${fmtM3.format(totM)}</td><td></td></tr></tfoot></table>
    <div class="pie"><span>% Mix y % M³: participación de cada producto dentro de su largo.</span>
    <span>Generado ${new Date().toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" })}</span></div>`;

  $("hoja").innerHTML = html;
  $("btnImprimir").disabled = false;
}

/* ---------- Mensajes ---------- */
function mostrarEstado(txt, girando) {
  $("hoja").innerHTML = `<div class="estado">${girando ? '<span class="cargando"></span>' : ""}${esc(txt)}</div>`;
}
function mostrarError(e) {
  const m = String(e && e.message || e);
  let txt, det = "";
  if (m === "ACCESO") {
    txt = "No se pudo leer la planilla de producción.";
    det = "La planilla tiene que estar compartida como “Cualquier persona con el enlace” con permiso de lector. Revisa eso y presiona Actualizar.";
  } else if (m === "TIEMPO") {
    txt = "Google tardó demasiado en responder.";
    det = "Revisa la conexión a internet y presiona Actualizar.";
  } else if (m.startsWith("COLUMNAS|")) {
    const [, faltan, hay] = m.split("|");
    txt = "La planilla no tiene todas las columnas que necesita el reporte.";
    det = `Faltan: ${faltan}. Columnas encontradas: ${hay}. Ajusta los nombres en CONFIG.columnas del archivo index.html.`;
  } else if (m === "SINDATOS") {
    txt = "La pestaña de la planilla no tiene filas con fecha.";
  } else {
    txt = "Google devolvió un error al leer la planilla.";
    det = m;
  }
  $("hoja").innerHTML = `<div class="estado error">${esc(txt)}<span class="det">${esc(det)}</span></div>`;
  $("btnImprimir").disabled = true;
}

/* ---------- Eventos ---------- */
$("selAnio").onchange = () => { llenarMeses(); cargarMes(); };
$("selMes").onchange = () => cargarMes();
$("btnActualizar").onclick = () => (estado.periodos.length ? cargarMes() : iniciar());
$("btnImprimir").onclick = () => { $("maq").open = false; window.print(); };
$("maqTodas").onclick = () => { $("maqGrupos").querySelectorAll("input").forEach(i => i.checked = true); leerMaquinas(); };
$("maqNinguna").onclick = () => { $("maqGrupos").querySelectorAll("input").forEach(i => i.checked = false); leerMaquinas(); };
document.addEventListener("click", (ev) => { if (!$("maq").contains(ev.target)) $("maq").open = false; });

iniciar();
</script>
</body>
</html>
